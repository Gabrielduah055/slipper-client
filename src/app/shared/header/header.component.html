<!-- Top Navigation Bar -->
<header class="fixed top-0 w-full z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between gap-4 lg:gap-8">
      <!-- Logo -->
      <div class="flex items-center gap-3 shrink-0 cursor-pointer" routerLink="/">
        <div class="bg-primary p-2 rounded-lg">
          <span class="material-symbols-outlined text-white">home_filled</span>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white uppercase hidden sm:block">Slippers Ghana</h1>
        <h1 class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white uppercase sm:hidden">SG</h1>
      </div>

      <!-- Desktop Main Nav -->
      <nav class="hidden lg:flex items-center gap-8">
        <div class="group relative">
          <button class="flex items-center gap-1 text-sm font-semibold hover:text-primary transition-colors" routerLink="/shop">
            Shop <span class="material-symbols-outlined text-sm">expand_more</span>
          </button>
        </div>
        <a class="text-sm font-semibold hover:text-primary transition-colors" routerLink="/shop">Men</a>
        <a class="text-sm font-semibold hover:text-primary transition-colors" routerLink="/shop">Women</a>
        <a class="text-sm font-semibold hover:text-primary transition-colors" routerLink="/shop">Kids</a>
        <a class="text-sm font-semibold hover:text-primary transition-colors" routerLink="/about">About</a>
      </nav>

      <!-- Desktop Search (Cleaner Look) -->
      <div class="flex-1 max-w-md hidden lg:block">
        <div class="relative group">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary transition-colors">search</span>
          <input class="w-full bg-transparent border border-slate-200 dark:border-slate-700 rounded-full pl-10 pr-4 py-2.5 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all placeholder:text-slate-400" placeholder="Search handcrafted styles..." type="text"/>
        </div>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-2 sm:gap-4">
        
        <!-- Cart Icon with Badge (Visible on all screens) -->
        <button class="relative p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors" routerLink="/cart">
            <span class="material-symbols-outlined text-slate-900 dark:text-white">shopping_cart</span>
            <span *ngIf="(cartCount$ | async) as count" 
                  class="absolute top-0 right-0 -mt-1 -mr-1 bg-primary text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-white dark:border-slate-900">
                {{ count }}
            </span>
        </button>

        <!-- Mobile Actions (Search & Menu Only) -->
        <button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors lg:hidden" (click)="toggleSearch()">
            <span class="material-symbols-outlined text-slate-900 dark:text-white">search</span>
        </button>
        
        <button class="p-2 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full transition-colors lg:hidden" (click)="toggleMenu()">
          <span class="material-symbols-outlined text-slate-900 dark:text-white">{{ isMenuOpen ? 'close' : 'menu' }}</span>
        </button>
      </div>
    </div>

    <!-- Mobile Search Overlay -->
    <div class="lg:hidden absolute top-20 left-0 w-full bg-background-light dark:bg-background-dark border-b border-slate-200 dark:border-slate-800 p-4 shadow-lg transition-all duration-300 origin-top" [ngClass]="{'scale-y-100 opacity-100': isSearchOpen, 'scale-y-0 opacity-0': !isSearchOpen}">
        <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
            <input class="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-xl pl-10 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 transition-all" placeholder="Search..." type="text"/>
        </div>
    </div>

    <!-- Mobile Navigation Menu -->
    <div class="lg:hidden absolute top-20 left-0 w-full bg-background-light dark:bg-background-dark border-b border-slate-200 dark:border-slate-800 shadow-xl transition-all duration-300 overflow-hidden" [ngClass]="{'max-h-[500px] opacity-100': isMenuOpen, 'max-h-0 opacity-0': !isMenuOpen}">
      <div class="flex flex-col p-6 space-y-4">
        <a class="text-base font-bold py-2 border-b border-slate-100 dark:border-slate-800 hover:text-primary transition-colors" routerLink="/shop" (click)="closeMenu()">Shop All</a>
        <a class="text-base font-bold py-2 border-b border-slate-100 dark:border-slate-800 hover:text-primary transition-colors" routerLink="/shop" (click)="closeMenu()">Men's Collection</a>
        <a class="text-base font-bold py-2 border-b border-slate-100 dark:border-slate-800 hover:text-primary transition-colors" routerLink="/shop" (click)="closeMenu()">Women's Collection</a>
        <a class="text-base font-bold py-2 border-b border-slate-100 dark:border-slate-800 hover:text-primary transition-colors" routerLink="/shop" (click)="closeMenu()">Kids' Styles</a>
        <a class="text-base font-bold py-2 border-b border-slate-100 dark:border-slate-800 hover:text-primary transition-colors" routerLink="/about" (click)="closeMenu()">About Us</a>
        
        <!-- Mobile Cart & Account Links (Since hidden from top bar) -->
        <div class="pt-2 flex flex-col gap-3">
            <a class="flex items-center gap-3 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-primary py-2" routerLink="/cart" (click)="closeMenu()">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span>Cart ({{ (cartCount$ | async) || 0 }})</span>
            </a>
            <a class="flex items-center gap-3 text-sm font-bold text-slate-600 dark:text-slate-300 hover:text-primary py-2" (click)="closeMenu()">
                <span class="material-symbols-outlined">person</span>
                <span>My Account</span>
            </a>
        </div>
      </div>
    </div>
</header>
