<div class="max-w-[800px] mx-auto px-6 lg:px-10 py-12">
    <!-- Breadcrumbs -->
    <div class="flex flex-wrap gap-2 mb-8">
        <a class="text-[#4c9a9a] text-sm font-medium hover:underline" routerLink="/">Home</a>
        <span class="text-[#4c9a9a] text-sm font-medium">/</span>
        <span class="text-[#0d1b1b] dark:text-white text-sm font-medium">FAQs</span>
    </div>

    <div class="text-center mb-12">
        <h1 class="text-3xl md:text-4xl font-black text-slate-900 dark:text-white mb-4">Frequently Asked Questions</h1>
        <p class="text-slate-500 dark:text-slate-400">
            Got questions? We've got answers. If you can't find what you're looking for, feel free to contact us.
        </p>
    </div>

    <!-- FAQ Accordion -->
    <div class="space-y-4">
        <div *ngFor="let faq of faqs; let i = index" class="bg-white dark:bg-slate-900/50 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden transition-all">
            <button (click)="toggleFaq(i)" class="w-full flex items-center justify-between p-6 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                <span class="font-bold text-slate-900 dark:text-white text-lg pr-4">{{ faq.question }}</span>
                <span class="material-symbols-outlined text-slate-400 transition-transform duration-300" [class.rotate-180]="faq.isOpen">expand_more</span>
            </button>
            <div class="px-6 pb-6 text-slate-600 dark:text-slate-400 leading-relaxed" [class.hidden]="!faq.isOpen">
                {{ faq.answer }}
            </div>
        </div>
    </div>

    <!-- Contact CTA -->
    <div class="mt-16 text-center">
        <p class="text-slate-500 dark:text-slate-400 mb-6">Still have questions?</p>
        <a href="https://wa.me/233000000000" class="inline-flex items-center gap-2 bg-primary text-white font-bold py-3 px-8 rounded-xl hover:opacity-90 transition-opacity">
            <span class="material-symbols-outlined">chat</span>
            Chat with Us
        </a>
    </div>
</div>
