<section class="max-w-7xl mx-auto px-6 pt-16 pb-8">
    <div class="flex flex-col items-center text-center space-y-4">
        <h2 class="text-3xl md:text-4xl lg:text-5xl font-extrabold text-slate-900 dark:text-white">Shop by Category</h2>
        <p class="text-sm md:text-lg text-slate-600 dark:text-slate-400 max-w-2xl">
            Explore our curated collections of handcrafted footwear, from traditional leather styles to modern custom orders.
        </p>
        <div class="w-24 h-1 bg-primary rounded-full mt-4"></div>
    </div>
</section>
<section class="max-w-7xl mx-auto px-6 py-12">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        
        <div *ngFor="let category of categories" class="category-card group cursor-pointer relative bg-white dark:bg-slate-900 rounded-3xl overflow-hidden shadow-sm hover:shadow-2xl transition-all duration-500" [routerLink]="['/shop']" [queryParams]="{ category: category }">
            <div class="aspect-[4/5] overflow-hidden">
                <img [alt]="category" class="w-full h-full object-cover transition-transform duration-700" [src]="getDetails(category).image"/>
                <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/20 to-transparent"></div>
            </div>
            <div class="absolute inset-0 p-8 flex flex-col justify-end">
                <h3 class="text-xl md:text-3xl font-bold text-white mb-2">{{ category }}</h3>
                <p class="text-slate-300 text-sm md:text-base mb-6 line-clamp-2">{{ getDetails(category).description }}</p>
                <div class="cta-button w-fit px-6 py-3 rounded-xl border border-primary/50 text-primary font-bold transition-all flex items-center gap-2 group-hover:text-white">
                    Shop Now <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </div>
            </div>
        </div>

        <!-- Loading State -->
        <div *ngIf="categories.length === 0" class="col-span-full flex flex-col items-center justify-center py-20 text-slate-500">
             <div class="w-12 h-12 border-4 border-slate-200 border-t-primary rounded-full animate-spin mb-4"></div>
             <p>Loading categories...</p>
        </div>

    </div>
</section>
