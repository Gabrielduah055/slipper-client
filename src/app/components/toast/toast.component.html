<div *ngIf="toast$ | async as toast" @slideInOut
     class="fixed bottom-6 right-6 md:bottom-8 md:right-8 z-[200] flex items-center gap-4 px-6 py-4 rounded-xl shadow-2xl min-w-[300px] border border-white/10"
     [ngClass]="{
        'bg-slate-900 text-white': toast.type === 'success',
        'bg-red-600 text-white': toast.type === 'error',
        'bg-blue-600 text-white': toast.type === 'info'
     }">
    
    <div class="flex items-center gap-3 flex-1">
        <span class="material-symbols-outlined text-green-400" *ngIf="toast.type === 'success'">check_circle</span>
        <span class="material-symbols-outlined text-white" *ngIf="toast.type === 'error'">error</span>
        <span class="material-symbols-outlined text-white" *ngIf="toast.type === 'info'">info</span>
        
        <p class="font-medium text-sm">{{ toast.text }}</p>
    </div>

    <a *ngIf="toast.action?.route" [routerLink]="toast.action?.route" 
       class="text-xs font-bold uppercase tracking-wider bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition-colors cursor-pointer"
       (click)="toastService.clear()">
        {{ toast.action?.label }}
    </a>
</div>
